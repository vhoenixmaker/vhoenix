<!-- Inline base58 encoder for Phantom signature (no external dependency) -->
<script>
  // Minimal, self-contained base58 encoder for Uint8Array → string.
  // Uses the Bitcoin/Solana alphabet. No external library needed.
  window.bs58 = {
    encode: function(bytes) {
      const ALPHABET = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
      if (!(bytes instanceof Uint8Array)) {
        bytes = new Uint8Array(bytes);
      }
      if (bytes.length === 0) return '';

      // Count leading zero bytes
      let zeros = 0;
      while (zeros < bytes.length && bytes[zeros] === 0) zeros++;

      // Allocate enough space in big-endian base58 representation
      const size = Math.ceil((bytes.length - zeros) * 1.365) + 1;
      const b58 = new Uint8Array(size);

      let length = 0;
      for (let i = zeros; i < bytes.length; i++) {
        let carry = bytes[i];
        let j = 0;
        for (let k = size - 1; (carry !== 0 || j < length) && k >= 0; k--, j++) {
          carry += 256 * b58[k];
          b58[k] = carry % 58;
          carry = Math.floor(carry / 58);
        }
        length = j;
      }

      // Skip leading zeros in base58 result
      let it = size - length;
      while (it < size && b58[it] === 0) it++;

      // Build string: leading '1's for each leading zero byte + base58 digits
      let result = '1'.repeat(zeros);
      for (; it < size; it++) {
        result += ALPHABET[b58[it]];
      }
      return result;
    }
  };
</script>

            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-box input-field rounded-xl w-12 h-14 text-center text-xl font-mono text-zinc-100 outline-none" data-index="3" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-box input-field rounded-xl w-12 h-14 text-center text-xl font-mono text-zinc-100 outline-none" data-index="4" />
            <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" class="otp-box input-field rounded-xl w-12 h-14 text-center text-xl font-mono text-zinc-100 outline-none" data-index="5" />

<script>
  // =====================================================
  // Configuration — CHANGE THIS if API is on different domain
  // =====================================================
  const API_BASE = '/api';        // Same domain
  // const API_BASE = 'https://yourdomain.com/api'; // If frontend on separate domain

  // =====================================================
  // State
  // =====================================================
  let currentTab = 'signin';
  let isLoading = false;

  // =====================================================
  // Tab switching
  // =====================================================
  function switchTab(tab) {
    currentTab = tab;
    clearAlert();

    const isSignup = tab === 'signup';

    // Update tab buttons
    document.getElementById('tab-signin').classList.toggle('active', !isSignup);
    document.getElementById('tab-signin').classList.toggle('text-zinc-500', isSignup);
    document.getElementById('tab-signup').classList.toggle('active', isSignup);
    document.getElementById('tab-signup').classList.toggle('text-zinc-500', !isSignup);

    // Update labels
    document.getElementById('form-title').textContent = isSignup ? 'Create account' : 'Welcome back';
    document.getElementById('form-subtitle').textContent = isSignup ? 'Join VHOENIX and hunt alpha with AI' : 'Sign in to start hunting alpha';
    document.getElementById('submit-label').textContent = isSignup ? 'Create Account' : 'Sign In';
    document.getElementById('phantom-label').textContent = isSignup ? 'Sign up with Phantom' : 'Connect Phantom Wallet';

    // Show/hide name field + password hint
    document.getElementById('field-name').classList.toggle('hidden', !isSignup);
    document.getElementById('password-hint').classList.toggle('hidden', !isSignup);

    // Footer
    document.getElementById('footer-prompt').textContent = isSignup ? 'Already have an account?' : 'No account yet?';
    document.getElementById('footer-link').textContent = isSignup ? 'Sign in' : 'Create one free';
    document.getElementById('footer-link').setAttribute('onclick', `switchTab('${isSignup ? 'signin' : 'signup'}')`);
  }

  // =====================================================
  // UI helpers
  // =====================================================
  function showAlert(message, type = 'error') {
    const el = document.getElementById('alert');
    el.textContent = message;
    el.className = `mb-4 px-4 py-3 rounded-xl text-xs font-medium ${type === 'error' ? 'alert-error' : 'alert-info'}`;
    el.classList.remove('hidden');
  }

  function clearAlert() {
    document.getElementById('alert').classList.add('hidden');
  }

  function setLoading(loading) {
    isLoading = loading;
    document.getElementById('btn-submit').disabled = loading;
    document.getElementById('btn-phantom').disabled = loading;
    document.getElementById('submit-spinner').classList.toggle('hidden', !loading);
    document.getElementById('submit-arrow').classList.toggle('hidden', loading);
  }

  function togglePassword() {
    const input = document.getElementById('input-password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('icon', 'solar:eye-closed-linear');
    } else {
      input.type = 'password';
      icon.setAttribute('icon', 'solar:eye-linear');
    }
  }

  // =====================================================
  // Email/password form handler
  // =====================================================
  async function handleEmailSubmit(event) {
    event.preventDefault();
    if (isLoading) return;
    clearAlert();

    const email = document.getElementById('input-email').value.trim().toLowerCase();
    const password = document.getElementById('input-password').value;
    const displayName = document.getElementById('input-name').value.trim();

    if (!email || !password) {
      showAlert('Email and password are required');
      return;
    }
    if (currentTab === 'signup' && password.length < 8) {
      showAlert('Password must be at least 8 characters');
      return;
    }

    setLoading(true);

    try {
      const action = currentTab === 'signup' ? 'register' : 'login';
      const payload = { email, password };
      if (currentTab === 'signup' && displayName) payload.display_name = displayName;

      const res = await fetch(`${API_BASE}/auth.php?action=${action}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(payload),
      });

      const data = await res.json();

      if (!res.ok || !data.success) {
        // Check if login needs email verification
        if (data.needs_verification && data.email) {
          showOtpView(data.email, data.dev_otp);
          return;
        }
        showAlert(data.error || 'Something went wrong');
        return;
      }

      // OTP flow: registration returned "otp_sent" status
      if (data.status === 'otp_sent') {
        showOtpView(data.email || email, data.dev_otp);
        return;
      }

      // Success — redirect to dashboard
      showAlert('Success! Redirecting...', 'info');
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);

    } catch (err) {
      console.error(err);
      showAlert('Network error. Please try again.');
    } finally {
      setLoading(false);
    }
  }

  // =====================================================
  // Phantom wallet connection
  // =====================================================
  async function connectPhantom() {
    if (isLoading) return;
    clearAlert();

    // Detect Phantom
    const provider = window?.phantom?.solana;
    if (!provider || !provider.isPhantom) {
      showAlert('Phantom wallet not detected. Install it from phantom.app');
      setTimeout(() => window.open('https://phantom.app/', '_blank'), 1200);
      return;
    }

    setLoading(true);

    try {
      // 1. Connect wallet (triggers Phantom popup)
      const resp = await provider.connect();
      const walletAddress = resp.publicKey.toString();

      // 2. Request nonce from server
      const nonceRes = await fetch(`${API_BASE}/wallet.php?action=nonce`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ wallet_address: walletAddress }),
      });
      const nonceData = await nonceRes.json();
      if (!nonceRes.ok || !nonceData.success) {
        showAlert(nonceData.error || 'Failed to get nonce');
        return;
      }

      // 3. Ask user to sign the message (Phantom popup)
      const message = nonceData.message;
      const encodedMessage = new TextEncoder().encode(message);
      const signedMessage = await provider.signMessage(encodedMessage, 'utf8');

      // signedMessage.signature is a Uint8Array (64 bytes)
      // We send it as base58 string (Phantom's native format)
      const signatureBase58 = bs58.encode(signedMessage.signature);

      // 4. Verify signature with server
      const verifyRes = await fetch(`${API_BASE}/wallet.php?action=verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          wallet_address: walletAddress,
          signature: signatureBase58,
          nonce: nonceData.nonce,
        }),
      });
      const verifyData = await verifyRes.json();
      if (!verifyRes.ok || !verifyData.success) {
        showAlert(verifyData.error || 'Signature verification failed');
        return;
      }

      // Success!
      showAlert('Wallet connected! Redirecting...', 'info');
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 500);

    } catch (err) {
      console.error('Phantom error:', err);
      if (err.code === 4001 || err.message?.includes('reject')) {
        showAlert('You cancelled the signature request');
      } else {
        showAlert(err.message || 'Failed to connect wallet');
      }
    } finally {
      setLoading(false);
    }
  }

  // =====================================================
  // Auto-redirect if already logged in
  // =====================================================
  (async function checkExistingSession() {
    try {
      const res = await fetch(`${API_BASE}/auth.php?action=me`, {
        credentials: 'include',
      });
      if (res.ok) {
        const data = await res.json();
        if (data.success && data.user) {
          // Already logged in
          window.location.href = '/dashboard.html';
        }
      }
    } catch (e) {
      // Silently ignore — user just needs to log in
    }
  })();

  // =====================================================
  // OTP Verification Handlers
  // =====================================================
  let otpEmail = '';
  let resendCountdown = 0;
  let resendTimer = null;

  function showOtpView(email, devOtp) {
    otpEmail = email;
    document.getElementById('otp-email-display').textContent = email;

    // Hide main login UI, show OTP view
    document.getElementById('tab-signin').parentElement.classList.add('hidden');
    document.getElementById('btn-phantom').classList.add('hidden');
    document.querySelector('.flex.items-center.gap-3.my-6').classList.add('hidden'); // "OR with email" divider
    document.getElementById('email-form').classList.add('hidden');
    document.getElementById('form-footer').classList.add('hidden');
    document.getElementById('form-title').textContent = 'Verify email';
    document.getElementById('form-subtitle').textContent = 'One more step to start hunting alpha';
    document.getElementById('otp-view').classList.remove('hidden');
    clearAlert();

    // Dev mode: show the OTP directly for testing convenience
    if (devOtp) {
      console.log('🔓 DEV OTP:', devOtp);
      showOtpAlert('Dev mode: OTP = ' + devOtp, 'info');
    }

    // Focus first box
    setTimeout(() => document.querySelector('.otp-box[data-index="0"]').focus(), 100);

    // Start resend cooldown
    startResendCooldown(30);
  }

  function backToLogin() {
    document.getElementById('otp-view').classList.add('hidden');
    document.getElementById('tab-signin').parentElement.classList.remove('hidden');
    document.getElementById('btn-phantom').classList.remove('hidden');
    document.querySelector('.flex.items-center.gap-3.my-6').classList.remove('hidden');
    document.getElementById('email-form').classList.remove('hidden');
    document.getElementById('form-footer').classList.remove('hidden');
    document.getElementById('form-title').textContent = currentTab === 'signup' ? 'Create account' : 'Welcome back';
    document.getElementById('form-subtitle').textContent = currentTab === 'signup' ? 'Start hunting alpha today' : 'Sign in to start hunting alpha';
    otpEmail = '';
    clearOtpInputs();
  }

  function clearOtpInputs() {
    document.querySelectorAll('.otp-box').forEach(b => { b.value = ''; });
  }

  // Auto-focus next box as user types + handle backspace
  document.querySelectorAll('.otp-box').forEach((box, idx) => {
    box.addEventListener('input', (e) => {
      const v = e.target.value.replace(/[^0-9]/g, '');
      e.target.value = v;
      if (v && idx < 5) {
        document.querySelector(`.otp-box[data-index="${idx + 1}"]`).focus();
      }
      // Auto-submit when all 6 filled
      if (idx === 5 && v) {
        const allFilled = Array.from(document.querySelectorAll('.otp-box')).every(b => b.value);
        if (allFilled) setTimeout(verifyOTP, 100);
      }
    });
    box.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && idx > 0) {
        document.querySelector(`.otp-box[data-index="${idx - 1}"]`).focus();
      }
    });
    box.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
      pasted.split('').forEach((digit, i) => {
        const b = document.querySelector(`.otp-box[data-index="${i}"]`);
        if (b) b.value = digit;
      });
      if (pasted.length === 6) setTimeout(verifyOTP, 100);
    });
  });

  async function verifyOTP() {
    const code = Array.from(document.querySelectorAll('.otp-box')).map(b => b.value).join('');
    if (code.length !== 6) {
      showOtpAlert('Please enter all 6 digits');
      return;
    }

    const spinner = document.getElementById('verify-spinner');
    const btn = document.getElementById('btn-verify-otp');
    spinner.classList.remove('hidden');
    btn.disabled = true;

    try {
      const res = await fetch(`${API_BASE}/auth.php?action=verify_otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email: otpEmail, otp: code }),
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        showOtpAlert(data.error || 'Invalid code. Please try again.');
        clearOtpInputs();
        document.querySelector('.otp-box[data-index="0"]').focus();
        return;
      }

      showOtpAlert('✓ Verified! Redirecting...', 'info');
      setTimeout(() => { window.location.href = '/dashboard.html'; }, 600);
    } catch (e) {
      showOtpAlert('Network error. Please try again.');
    } finally {
      spinner.classList.add('hidden');
      btn.disabled = false;
    }
  }

  async function resendOTP() {
    if (resendCountdown > 0) return;
    clearOtpInputs();
    try {
      const res = await fetch(`${API_BASE}/auth.php?action=resend_otp`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email: otpEmail }),
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        showOtpAlert(data.error || 'Failed to resend');
        return;
      }
      showOtpAlert('New code sent to your email', 'info');
      if (data.dev_otp) {
        console.log('🔓 DEV OTP:', data.dev_otp);
        showOtpAlert('Dev mode: New OTP = ' + data.dev_otp, 'info');
      }
      startResendCooldown(30);
    } catch (e) {
      showOtpAlert('Network error');
    }
  }

  function startResendCooldown(seconds) {
    resendCountdown = seconds;
    const label = document.getElementById('resend-label');
    const btn = document.getElementById('resend-btn');
    const update = () => {
      if (resendCountdown <= 0) {
        label.textContent = 'Resend code';
        btn.classList.remove('text-zinc-600');
        btn.classList.add('text-green-400');
        btn.disabled = false;
        clearInterval(resendTimer);
        return;
      }
      label.textContent = `Resend in ${resendCountdown}s`;
      btn.classList.add('text-zinc-600');
      btn.classList.remove('text-green-400');
      btn.disabled = true;
      resendCountdown--;
    };
    update();
    if (resendTimer) clearInterval(resendTimer);
    resendTimer = setInterval(update, 1000);
  }

  function showOtpAlert(msg, type = 'error') {
    const el = document.getElementById('otp-alert');
    el.textContent = msg;
    el.classList.remove('hidden', 'alert-error', 'alert-info');
    el.classList.add(type === 'info' ? 'alert-info' : 'alert-error');
  }
</script>
